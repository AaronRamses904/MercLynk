spring.application.name=merclynk

#creacion de bd en mysql
spring.datasource.url=jdbc:mysql://localhost:3306/merclynk_bd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Usuario y contraseña de MySQL
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Permite que Spring cree o actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

